[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 404s are real 404s now (not silently rewritten to index.html like the old
# SPA config): every URL either matches a real static page or correctly
# returns Not Found, which is what search engines expect.
[[redirects]]
  from = "/admin/*"
  to = "/beheerder/"
  status = 301

# Diensten was merged into Aanpak (too much overlap between the two pages),
# redirect so old links/bookmarks/search results still land somewhere real.
[[redirects]]
  from = "/diensten"
  to = "/aanpak"
  status = 301

# Language-specific 404: anything unmatched under /en/ shows the English
# 404 page instead of the Dutch one.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404
